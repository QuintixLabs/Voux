<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow">
  <title data-page-title="Page Not Found">Voux · Page Not Found</title>

  <!-- Icons -->
  <link rel="icon" href="/assets/logos/svg/logo-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
  <link rel="icon" href="/assets/logos/svg/logo-light.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">

  <!-- Local styles -->
  <link rel="stylesheet" href="/css/theme.css?v=%APP_VERSION%" />
  <link rel="stylesheet" href="/css/styles.css?v=%APP_VERSION%" />

  <script>
    try {
      if (
        localStorage.getItem('voux_session_hint') === '1' &&
        localStorage.getItem('voux_nav_user')
      ) {
        document.documentElement.classList.add('nav-auth-cached');
      }
    } catch {}
  </script>
</head>

<body data-page="404">

  <!-- JS DISABLED DETECTION -->
  <noscript>
    <style>
      body { opacity: 1 !important; }
      html, body { overflow: hidden; height: 100%; }
    </style>
    <div class="noscript-overlay">
      <div class="noscript-overlay__card">
        <h2>JavaScript required</h2>
        <p>
          Voux only runs its own scripts to fetch data from the API and render the UI. No third-party ads, trackers, analytics, miners, or fingerprinting are loaded.
        </p>
      </div>
    </div>
  </noscript>
  
  <header class="site-nav">
    <a class="brand" href="/">
      <img src="/assets/logos/png/logo-text.png" alt="Voux" />
    </a>
    <div class="nav-account">
      <button class="nav-link ghost nav-account__button" id="navAccountButton" aria-label="Account menu"><i class="icon" style="--icon:url('/assets/icons/ui/account-circle-fill.svg')" aria-hidden="true"></i></button>
            <div class="account-menu" id="navAccountMenu">
<a href="/profile" class="account-menu__link">
          <i class="icon" style="--icon:url('/assets/icons/ui/user.svg')" aria-hidden="true"></i>
          Profile
        </a>
<a href="/dashboard" class="account-menu__link">
          <i class="icon" style="--icon:url('/assets/icons/ui/dashboard-eye.svg')" aria-hidden="true"></i>
          Dashboard
        </a>
<a href="/settings" class="account-menu__link">
          <i class="icon" style="--icon:url('/assets/icons/ui/settings.svg')" aria-hidden="true"></i>
          Settings
        </a>
<button type="button" class="account-menu__link account-menu__logout" id="navAccountLogout">
          <i class="icon" style="--icon:url('/assets/icons/ui/logout.svg')" aria-hidden="true"></i>
          Log out
        </button>
      </div>
    </div>
  </header>

  <main class="page page--centered">
    <div class="not-found-minimal">
      <h1>404</h1>
      <p>Looks like this link is empty.</p>
      <a class="nav-link go-home" href="/">
        <i class="icon" style="--icon:url('/assets/icons/ui/home.svg')" aria-hidden="true"></i> Go home
      </a>
    </div>
  </main>

  <div data-footer-root></div>

  <!-- Local scripts -->
  <script src="/js/layout/nav.js?v=%APP_VERSION%"></script>
  <script src="/js/appearance/theme.js?v=%APP_VERSION%" defer></script>
  <script src="/js/appearance/brand.js?v=%APP_VERSION%" defer></script>
  <script src="/js/utils/modal.js?v=%APP_VERSION%" defer></script>
  <script src="/js/utils/state.js?v=%APP_VERSION%" defer></script>
  <script src="/js/layout/footer.js?v=%APP_VERSION%" defer></script>
</body>

</html>
